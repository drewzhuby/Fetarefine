model:
  name: diffunet_patience100
  features:
  - 64
  - 64
  - 128
  - 256
  - 512
  - 64
  timesteps: 1000
  ddim_steps: 10
  beta_schedule: linear
training:
  batch_size: 2
  patch_size:
  - 96
  - 96
  - 96
  samples_per_case: 4
  optimizer: AdamW
  lr: 0.0002
  weight_decay: 0.001
  max_epochs: 500
  warmup_epochs: 50
  early_stopping_patience: 100
  loss: Dice(sigmoid) + BCE + MSE
  seed: 20260918
  precision: float32
  lr_schedule: cosine
  min_epochs: 100
  val_every: 5
  patience_checks: 20
  min_delta: 0.001
